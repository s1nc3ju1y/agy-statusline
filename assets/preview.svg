<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f111a"/>
      <stop offset="100%" stop-color="#161926"/>
    </linearGradient>
    <filter id="shadow" x="-2%" y="-4%" width="104%" height="108%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <style>
      .mono {
        font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 13.5px;
      }
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #8b949e;
      }
      .badge {
        font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
        font-size: 12px;
        font-weight: 700;
      }
      .bold { font-weight: 700; }
      .muted { fill: #7f849c; }
      .label { fill: #89b4fa; }
      .text  { fill: #cdd6f4; }
      .green { fill: #5fd787; }
      .yellow { fill: #ffd700; }
      .orange { fill: #ff8700; }
      .cyan  { fill: #5fd7ff; }
      .gold  { fill: #ffaf5f; }
      .empty { fill: #3b4261; }
      .card  { fill: #1a1d2d; stroke: #2a2e45; stroke-width: 1; rx: 8; }
      .cmdbox { fill: #121420; stroke: #3b4261; stroke-width: 1.2; rx: 8; }
    </style>
  </defs>

  <!-- Outer Window -->
  <rect x="12" y="10" width="1096" height="406" rx="12" fill="url(#bgGrad)" stroke="#2e344e" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Window Title Bar -->
  <rect x="12" y="10" width="1096" height="38" rx="12" fill="#181b28"/>
  <rect x="12" y="36" width="1096" height="12" fill="#181b28"/>
  <line x1="12" y1="48" x2="1108" y2="48" stroke="#282c40" stroke-width="1"/>
  <circle cx="34" cy="29" r="6" fill="#ff5f56"/>
  <circle cx="54" cy="29" r="6" fill="#ffbd2e"/>
  <circle cx="74" cy="29" r="6" fill="#27c93f"/>
  <text x="560" y="34" text-anchor="middle" class="title">agy-statusline — Unified HUD Telemetry for Google Antigravity CLI (agy)</text>

  <!-- Preset 1: Detailed -->
  <rect x="32" y="66" width="1056" height="74" class="card"/>
  <rect x="46" y="78" width="218" height="20" rx="4" fill="#1e3a5f"/>
  <text x="56" y="92" class="badge cyan">/statusline 详细  |  detailed</text>
  <text x="276" y="92" class="mono muted">Full Telemetry + 5h &amp; Weekly Quota Reset Countdown</text>
  <text x="46" y="124" class="mono">
    <tspan class="text bold">Gemini 4 Argon</tspan>
    <tspan class="muted"> (High) · </tspan>
    <tspan class="yellow">auto</tspan>
    <tspan class="muted"> · ⎇ main</tspan><tspan class="yellow">*</tspan>
    <tspan class="muted">  │  </tspan>
    <tspan class="label">CTX </tspan>
    <tspan class="muted">[</tspan><tspan class="green">██▍</tspan><tspan class="empty">░░░░░░░</tspan><tspan class="muted">] </tspan>
    <tspan class="green bold">23.4%</tspan>
    <tspan class="muted"> (245k/1.05M)  │  </tspan>
    <tspan class="label">Σ </tspan><tspan class="text bold">12.4M</tspan><tspan class="muted"> (Cache 96%) · </tspan>
    <tspan class="gold bold">💰 $7.48</tspan>
    <tspan class="muted">  │  </tspan>
    <tspan class="cyan">⚡ </tspan><tspan class="green bold">42.8 tok/s</tspan><tspan class="cyan"> ⟳</tspan>
    <tspan class="muted">  │  </tspan>
    <tspan class="label">Quota </tspan>
    <tspan class="muted">5h:</tspan><tspan class="green bold">77%</tspan><tspan class="muted">(29m) </tspan>
    <tspan class="muted">Wk:</tspan><tspan class="green bold">89%</tspan><tspan class="muted">(6d14h)</tspan>
  </text>

  <!-- Preset 2: Standard -->
  <rect x="32" y="154" width="1056" height="74" class="card"/>
  <rect x="46" y="166" width="292" height="20" rx="4" fill="#1e3f2f"/>
  <text x="56" y="180" class="badge green">/statusline 标准  |  standard (Default)</text>
  <text x="350" y="180" class="mono muted">Balanced Daily Driver — Native Info + Context Bar + Cache% + Cost + Speed</text>
  <text x="46" y="212" class="mono">
    <tspan class="text bold">Gemini 4 Argon</tspan>
    <tspan class="muted"> (High) · </tspan>
    <tspan class="green">accept-edits</tspan>
    <tspan class="muted"> · ⎇ feat/hud</tspan><tspan class="yellow">*</tspan>
    <tspan class="muted"> · </tspan><tspan class="cyan">1 subagent</tspan>
    <tspan class="muted">  │  </tspan>
    <tspan class="label">CTX </tspan>
    <tspan class="muted">[</tspan><tspan class="yellow">█████▊</tspan><tspan class="empty">░░░░</tspan><tspan class="muted">] </tspan>
    <tspan class="yellow bold">57.5%</tspan>
    <tspan class="muted"> (147k/256k)  │  </tspan>
    <tspan class="label">Σ </tspan><tspan class="text bold">1.85M</tspan><tspan class="muted"> (Cache 94%) · </tspan>
    <tspan class="gold bold">💰 $1.12</tspan>
    <tspan class="muted">  │  </tspan>
    <tspan class="cyan">⚡ </tspan><tspan class="green bold">38.2 tok/s</tspan>
  </text>

  <!-- Preset 3: Minimal -->
  <rect x="32" y="242" width="1056" height="74" class="card"/>
  <rect x="46" y="254" width="218" height="20" rx="4" fill="#3b2e1e"/>
  <text x="56" y="268" class="badge gold">/statusline 简洁  |  minimal</text>
  <text x="276" y="268" class="mono muted">Ultra-Compact Mode for Narrow Split Panes</text>
  <text x="46" y="300" class="mono">
    <tspan class="text bold">Gemini 4 Argon</tspan>
    <tspan class="muted"> (H) · </tspan>
    <tspan class="cyan">plan</tspan>
    <tspan class="muted">  │  </tspan>
    <tspan class="label">CTX </tspan>
    <tspan class="muted">[</tspan><tspan class="orange">██████▌</tspan><tspan class="empty">░</tspan><tspan class="muted">] </tspan>
    <tspan class="orange bold">81%</tspan>
    <tspan class="muted">  │  </tspan>
    <tspan class="label">Σ </tspan><tspan class="text bold">640k</tspan>
    <tspan class="muted"> · </tspan>
    <tspan class="gold bold">💰 $0.42</tspan>
    <tspan class="muted">  │  </tspan>
    <tspan class="cyan">⚡ </tspan><tspan class="green bold">45.0 tok/s</tspan>
  </text>

  <!-- Interactive Slash Command Bar -->
  <rect x="32" y="332" width="1056" height="62" class="cmdbox"/>
  <text x="50" y="357" class="mono">
    <tspan class="cyan bold">❯ /statusline </tspan>
    <tspan class="text bold">详细</tspan>
    <tspan class="muted">     # Instant 0ms switch inside agy:  </tspan>
    <tspan class="gold">off</tspan>
    <tspan class="muted">  │  </tspan>
    <tspan class="green">简洁 / minimal</tspan>
    <tspan class="muted">  │  </tspan>
    <tspan class="cyan">标准 / standard</tspan>
    <tspan class="muted">  │  </tspan>
    <tspan class="yellow">详细 / detailed</tspan>
  </text>
  <text x="50" y="380" class="mono muted">
    ✓ Replaces built-in top-right statusline cleanly (stack_with_default: false) · Zero dependencies (Python 3 stdlib) · Incremental SQLite cache (&lt;15ms)
  </text>
</svg>
